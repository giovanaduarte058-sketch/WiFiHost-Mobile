
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Instalar workload Android
        run: dotnet workload install android

      - name: Encontrar e compilar projeto
        shell: bash
        run: |
          PROJECT=$(find . -name 'WiFiHost-Mobile.csproj' -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERRO: projeto não encontrado!"
            exit 1
          fi

          echo "Projeto encontrado: $PROJECT"
          dotnet publish "$PROJECT" -f net10.0-android -c Release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHost-Mobile-APK
          path: '**/bin/Release/net10.0-android/publish/*.apk'
          if-no-files-found: error
