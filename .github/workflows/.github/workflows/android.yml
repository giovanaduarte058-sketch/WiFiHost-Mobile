name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android workload
        run: dotnet workload install android

      - name: Compilar APK
        run: dotnet publish WiFiHost-Mobile.csproj -f net10.0-android -c Release

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFiHost-Mobile-APK
          path: '**/bin/Release/net10.0-android/publish/*.apk'
